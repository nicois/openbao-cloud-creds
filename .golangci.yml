# golangci-lint v2 config tuned for "slow accretion" code smells.
# Adopted from a stricter upstream config, reconciled with this repo's deliberate
# exclusions — each of which is commented at the setting it applies to.
# Run with: golangci-lint run   (golangci-lint v2.x)

version: "2"

run:
  timeout: 5m

formatters:
  enable:
    - gofmt
    - goimports

linters:
  default: standard

  enable:
    # Family 1: growth / complexity drift
    - gocyclo
    - gocognit
    - cyclop
    - funlen
    - nestif
    - maintidx
    # Family 2: boolean/flag params & enums
    - revive
    - mnd
    - goconst
    - exhaustive
    # Family 3: copy-paste & near-duplication
    - dupl
    - dupword
    # Family 4: dead / orphaned & comment rot
    - unused
    - unparam
    - ineffassign
    - wastedassign
    - godox
    - godot
    - predeclared
    - gocritic
    # Family 5: contract enforcement. An error response without a stable
    # error_code is invisible in review and indistinguishable from one with a
    # code until a client tries to switch on it — so the code-less path is
    # forbidden rather than merely discouraged (API-002).
    - forbidigo

  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (net/http.ResponseWriter).Write
    gocyclo:
      min-complexity: 15
    gocognit:
      min-complexity: 20
    cyclop:
      max-complexity: 15
      package-average: 8.0
    funlen:
      lines: 80
      statements: 50
      ignore-comments: true
    nestif:
      min-complexity: 4
    maintidx:
      under: 20
    mnd:
      checks: [argument, case, condition, operation, return, assign]
      ignored-numbers: ["0", "1", "2"]
    goconst:
      min-len: 3
      min-occurrences: 3
      numbers: true
    exhaustive:
      default-signifies-exhaustive: true
    forbidigo:
      analyze-types: true
      forbid:
        # credenvelope.ErrorResponse takes an ErrorCode as its first argument, so
        # it cannot be called without one. logical.ErrorResponse can, and was —
        # at 166 call sites, every config/role/minter-set/reconcile/rotate error
        # in the repo. Banning it is what makes "every error response carries a
        # code" a property of the build rather than of reviewer attention.
        - pattern: '^logical\.ErrorResponse$'
          msg: >-
            use credenvelope.ErrorResponse(code, msg, args...) so the response
            carries a stable error_code (API-002). Pick the code by what a client
            should DO: config_invalid (operator must fix input), unsupported (this
            cloud never will), upstream_* (the cloud's answer), internal (our bug).
    dupl:
      threshold: 100
    godox:
      keywords: [TODO, FIXME, HACK, BUG, OPTIMIZE]
    godot:
      scope: declarations
      capital: false
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - opinionated
        - performance
      disabled-checks:
        - hugeParam
    revive:
      rules:
        - name: argument-limit
          arguments: [5]
        - name: function-result-limit
          arguments: [3]
        - name: flag-parameter
        - name: function-length
          arguments: [60, 0]
        - name: cognitive-complexity
          arguments: [20]
        - name: cyclomatic
          arguments: [15]
        - name: max-public-structs
          arguments: [5]
        - name: unused-parameter
          disabled: true
        - name: unused-receiver
          disabled: true
        - name: deep-exit
        - name: unhandled-error
          arguments: ["fmt.Printf", "fmt.Println"]
        - name: confusing-naming
        - name: identical-branches

  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters: [funlen, gocyclo, gocognit, dupl, maintidx, goconst, mnd, revive, cyclop]
      # credenvelope.ErrorResponse is the one legitimate wrapper around
      # logical.ErrorResponse; banning it there would ban the fix as well.
      - path: pkg/credenvelope/errors\.go
        linters: [forbidigo]
