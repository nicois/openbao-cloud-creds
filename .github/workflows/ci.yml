name: CI

# Every branch, not just main. The branch carrying the capability probes, the
# conformance layer, the e2e layer and minter rotation had never been through CI at
# all — main's last run predated all of it (A21 in docs/audit-2026-08-22.md).
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'

      - name: Build
        run: go build github.com/nicois/openbao-cloud-creds/...

      - name: Test
        run: go test -race -coverprofile=coverage.out github.com/nicois/openbao-cloud-creds/...

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

      - name: Install golangci-lint
        run: |
          # Pin install.sh to the release tag, NOT master: the moving master
          # script verified a tarball against the .sbom.json checksum (asset-layout
          # drift), failing with a spurious hash mismatch.
          #
          # The version must be built with a Go at least as new as the stdlib it
          # parses. v2.12.2 cannot lint a Go 1.27 stdlib at all: its type checker
          # refuses the newer files outright, and rebuilding it locally only moves
          # the failure into staticcheck's IR builder, which panics on an AST form
          # in internal/poll. That is why this pin moves with the Go pin above.
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.13.1/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.13.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Delegated to the Makefile deliberately: this step used to carry its own
      # copy of the module list and had already drifted (no conformance module,
      # and the tag-gated e2e module is invisible without --build-tags).
      - name: Lint
        run: make lint

      # A module that does not build without the workspace cannot be consumed by
      # anyone outside this checkout — `go install .../cmd@tag`, a fork building one
      # plugin, or a per-module SBOM or licence scan. Eight of ten plugins were in
      # that state (A20).
      - name: Build every module standalone
        run: make build-standalone

      # Prove the release path works and produces hashes, so the instruction in
      # README's Installing section cannot rot.
      - name: Release artifacts
        run: make dist

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'

      # Pinned. This tool decides the security verdict, and it was the only @latest
      # in the workflow — so the verdict could change without a commit here.
      #
      # A pin is not "set and forget", though: v1.1.4 predated Go 1.27 and its bundled
      # x/tools SSA builder PANICKED on this repo's own source (`unexpected expr:
      # *ast.KeyValueExpr`, scanning pkg/baotest). A panicking scanner is worse than a
      # stale one — it exits non-zero, so it looks like a finding, and it stops the loop
      # partway, so the modules after it are never scanned at all. Four modules were
      # carrying a real grpc advisory behind that panic. Bump this whenever the Go
      # toolchain moves.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      # The module list is DERIVED from go.work. This step used to keep a third
      # hardcoded copy, which had already drifted: it omitted pkg/capability — the
      # package that gates every configuration write — plus conformance and e2e.
      - name: Run govulncheck (per module, scanned standalone)
        run: |
          fail=0
          for dir in $(sed -n 's|^[[:space:]]*\./||p' go.work); do
            echo "=== govulncheck $dir ==="
            # GOWORK=off so each module is scanned as a CONSUMER sees it. Under the
            # workspace, MVS raises versions across every module at once, which hid a
            # finding that is real for anyone building one module on its own (A20).
            (cd "$dir" && GOWORK=off govulncheck ./...) || fail=1
          done
          exit $fail

  # A release is thirty-odd tags at one commit, and the Go module proxy caches a version's
  # CONTENT permanently — so a tag cannot be corrected once published, only superseded by
  # another version. This repository has already paid that: v0.3.0 shipped with ten stale
  # requires and the remedy was a whole new release. So the tag set is verified after it is
  # pushed, as the last thing that can still catch a module left behind before anyone pins it.
  #
  # The local pre-push hook (`make install-hooks`) runs the same check BEFORE the push. This job
  # is the one that cannot be skipped with --no-verify.
  #
  # Why it tolerates an incomplete set for a while: `git push --tags` creates one workflow run
  # per tag, and the earliest runs legitimately start before their siblings' refs exist. A job
  # that failed on the first sight of an incomplete set would paint thirty-one runs red for every
  # green one, which teaches people to ignore exactly the check that matters. So it re-fetches
  # for a bounded window and reports only what is still missing at the end of it.
  release-tags:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The check reads every tag and compares the tagged commits to HEAD, so it needs the
          # history and the tags, not the default single-commit checkout.
          fetch-depth: 0
          fetch-tags: true

      - name: Verify the whole release is tagged
        run: |
          # refs/tags/pkg/requester/v0.5.0 -> v0.5.0
          version="${GITHUB_REF##*/}"
          echo "verifying the $version tag set (triggered by ${GITHUB_REF#refs/tags/})"
          for attempt in $(seq 1 12); do
            if make check-release-tags VERSION="$version"; then
              exit 0
            fi
            echo "--- incomplete after attempt $attempt; re-fetching tags in 10s"
            sleep 10
            git fetch --tags --force --quiet
          done
          echo "::error::the $version tag set is still incomplete two minutes after this run started"
          make check-release-tags VERSION="$version"

  registration-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'

      - name: Install OpenBao
        run: |
          # Release assets are named openbao_<ver>_linux_amd64.deb (not bao_…).
          # 2.6.2 is current and matches the sdk/v2 version every module requires.
          BAO_VERSION=2.6.2
          base="https://github.com/openbao/openbao/releases/download/v${BAO_VERSION}"
          curl -fsSL -o /tmp/bao.deb "${base}/openbao_${BAO_VERSION}_linux_amd64.deb"
          # Verify before installing. This was an unverified `dpkg -i` of a remote
          # package into the job that then builds and tests the plugins (A21).
          #
          # BOTH names here are volatile and neither is guessable, so check them against
          # the release's asset list before bumping the version. The checksum file has
          # been called three things: openbao_<ver>_SHA256SUMS (gone), then
          # checksums-<os>.txt split per platform (2.5.x), now a single checksums.txt
          # (2.6.x). The stale name is what broke this job — the .deb still downloaded
          # fine, and it was VERIFICATION that 404'd, which is the half whose absence
          # would otherwise be silent.
          curl -fsSL -o /tmp/bao.sums "${base}/checksums.txt"
          ( cd /tmp && grep "openbao_${BAO_VERSION}_linux_amd64.deb$" bao.sums | sed 's|  .*/|  |' > bao.deb.sum \
            && sed -i "s|openbao_${BAO_VERSION}_linux_amd64.deb|bao.deb|" bao.deb.sum \
            && sha256sum -c bao.deb.sum )
          sudo dpkg -i /tmp/bao.deb
          bao version

      - name: Registration smoke test
        run: ./scripts/registration-smoke-test.sh

      # The e2e layer needs the same `bao` binary and no cloud credentials (each
      # cloud's fake HTTP server stands in for the upstream), so it belongs in
      # this job rather than a third one.
      - name: End-to-end (plugins driven through a live OpenBao)
        run: make test-e2e
