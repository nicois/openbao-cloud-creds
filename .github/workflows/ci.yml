name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Build
        run: go build github.com/nicois/openbao-cloud-creds/...

      - name: Test
        run: go test -race -coverprofile=coverage.out github.com/nicois/openbao-cloud-creds/...

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          args: --help
          install-mode: binary

      - name: Lint
        run: |
          for dir in pkg/credenvelope pkg/recovery pkg/metrics pkg/reconciler pkg/cloudconfig pkg/worker \
                     plugins/credential-akamai plugins/credential-aws plugins/credential-azure \
                     plugins/credential-do plugins/credential-exoscale plugins/credential-gcp \
                     plugins/credential-oci plugins/credential-ovh plugins/credential-upcloud \
                     plugins/credential-vultr; do
            echo "=== Linting $dir ==="
            (cd "$dir" && golangci-lint run ./...)
          done

  registration-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Install OpenBao
        run: |
          BAO_VERSION=2.5.3
          curl -fsSL -o /tmp/bao.deb \
            "https://github.com/openbao/openbao/releases/download/v${BAO_VERSION}/bao_${BAO_VERSION}_linux_amd64.deb"
          sudo dpkg -i /tmp/bao.deb
          bao version

      - name: Registration smoke test
        run: ./scripts/registration-smoke-test.sh
