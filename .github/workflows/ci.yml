name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        run: go build github.com/nicois/openbao-cloud-creds/...

      - name: Test
        run: go test -race -coverprofile=coverage.out github.com/nicois/openbao-cloud-creds/...

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
