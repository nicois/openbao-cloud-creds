name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'

      - name: Build
        run: go build github.com/nicois/openbao-cloud-creds/...

      - name: Test
        run: go test -race -coverprofile=coverage.out github.com/nicois/openbao-cloud-creds/...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.12.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: |
          for dir in pkg/credenvelope pkg/recovery pkg/metrics pkg/reconciler pkg/cloudconfig pkg/worker pkg/plugintest \
                     plugins/credential-akamai plugins/credential-aws plugins/credential-azure \
                     plugins/credential-do plugins/credential-exoscale plugins/credential-gcp \
                     plugins/credential-oci plugins/credential-ovh plugins/credential-upcloud \
                     plugins/credential-vultr; do
            echo "=== Linting $dir ==="
            (cd "$dir" && golangci-lint run ./...)
          done

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck (per module)
        run: |
          for dir in pkg/credenvelope pkg/recovery pkg/metrics pkg/reconciler pkg/cloudconfig pkg/worker pkg/plugintest \
                     plugins/credential-akamai plugins/credential-aws plugins/credential-azure \
                     plugins/credential-do plugins/credential-exoscale plugins/credential-gcp \
                     plugins/credential-oci plugins/credential-ovh plugins/credential-upcloud \
                     plugins/credential-vultr; do
            echo "=== govulncheck $dir ==="
            (cd "$dir" && govulncheck ./...)
          done

  registration-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'

      - name: Install OpenBao
        run: |
          # Release assets are named openbao_<ver>_linux_amd64.deb (not bao_…),
          # and v2.5.3 shipped no .deb (404). Use 2.5.4 (matches the spike cluster).
          BAO_VERSION=2.5.4
          curl -fsSL -o /tmp/bao.deb \
            "https://github.com/openbao/openbao/releases/download/v${BAO_VERSION}/openbao_${BAO_VERSION}_linux_amd64.deb"
          sudo dpkg -i /tmp/bao.deb
          bao version

      - name: Registration smoke test
        run: ./scripts/registration-smoke-test.sh
